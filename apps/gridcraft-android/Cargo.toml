[package]
name = "gridcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GridCraft Android app shell (eframe/wgpu + GameActivity + SAF + IME + Cast)"

[lib]
name = "gridcraft_android"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-game-activity"] }
jni = { version = "0.22" }
